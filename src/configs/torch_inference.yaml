defaults:
  - model: torch_fast_conformer
  - metrics: wer_cer
  - datasets: librispeech_eval # we do not want to run inference on training data
  - dataloader: conformer
  - transforms: inference
  - tokenizer: librispeech_bpe
  - tokenizer_training: none
  - ctc_decoder: argmax
  - _self_
inferencer:
  device_tensors: ["spectrogram", "text_encoded", "spectrogram_length"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "inference" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "saved/model_best.pth" # path to the pretrained model
  amp:
    enabled: true
    dtype: float16 # float16 or bfloat16
